<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WordStreak — 英単語学習アプリ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0B0C">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WordStreak">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0A0B0C; --surface:#17191B; --text:#ECEDEE; --text-dim:#ABB1B6; --text-faint:#98A0A6;
    --accent:#2FE8D0; --accent-dim:#123B37; --accent-ink:#04201C;
    --ok:#4ADE80; --ok-dim:#12301D; --ng:#F87171; --ng-dim:#3B1717;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
    --r-s:12px; --r-m:20px; --r-pill:999px;
    --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:32px; --fs-hero:48px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans JP',-apple-system,sans-serif; font-size:var(--fs-sm); -webkit-font-smoothing:antialiased; }
  body{ min-height:100vh; }
  html{ background:var(--bg); } body{ background:transparent; }
  button{ font-family:inherit; -webkit-tap-highlight-color:transparent; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
  .wrap{ max-width:480px; margin:0 auto; padding:calc(var(--safe-t) + 16px) 18px calc(var(--safe-b) + 60px); }
  @media (min-width:768px){ .wrap{ max-width:720px; padding-left:32px; padding-right:32px; } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .brand-btn{ background:none; border:none; cursor:pointer; padding:8px 0; text-align:left; min-height:44px; }
  .brand-title{ color:#fff; font-family:'Inter',sans-serif; font-weight:800; font-size:var(--fs-lg); letter-spacing:-.02em; }
  .brand-logo{ height:20px; width:auto; display:block; }
  .topbar-right{ display:flex; align-items:center; gap:10px; min-width:0; }
  .current-file{ font-size:var(--fs-xs); color:var(--text-faint); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hamburger-btn{ display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; width:44px; height:44px; background:none; border:1px solid var(--line-strong); border-radius:var(--r-s); cursor:pointer; padding:0; flex-shrink:0; }
  .hamburger-btn span{ display:block; height:2px; width:18px; background:var(--text); border-radius:2px; }

  .menu-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .menu-backdrop.show{ opacity:1; pointer-events:auto; }
  .menu-panel{ position:fixed; top:0; right:0; height:100%; width:80%; max-width:320px; background:var(--surface); border-left:1px solid var(--line-strong); z-index:50; transform:translateX(100%); transition:transform .32s cubic-bezier(.4,0,.2,1); padding:calc(var(--safe-t) + 20px) 16px 20px; display:flex; flex-direction:column; }
  .menu-panel.open{ transform:translateX(0); }
  .menu-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .menu-header span{ font-weight:700; font-size:var(--fs-md); }
  .menu-close{ background:none; border:1px solid var(--line-strong); color:var(--text); width:44px; height:44px; border-radius:var(--r-s); cursor:pointer; font-size:var(--fs-sm); }
  .menu-panel button[data-menu]{ background:none; border:none; border-bottom:1px solid var(--line); color:var(--text); text-align:left; min-height:52px; padding:0 8px; font-size:var(--fs-md); cursor:pointer; }
  .menu-panel button[data-menu]:hover{ color:var(--accent); }
  .menu-panel button.danger{ color:var(--ng); }
  .menu-panel button.danger:hover{ color:var(--ng); }
  .menu-panel button[hidden]{ display:none; }

  nav{ display:flex; border-bottom:1px solid var(--line-strong); margin-bottom:22px; overflow-x:auto; }
  nav button{ flex:1; background:none; border:none; color:var(--text-dim); font-size:var(--fs-sm); font-weight:500; min-height:48px; padding:0 4px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
  nav button.active{ color:var(--accent); border-bottom-color:var(--accent); }

  .screen{ display:none; } .screen.active{ display:block; }
  .empty{ text-align:center; padding:40px 16px; color:var(--text-faint); font-size:var(--fs-sm); line-height:1.7; border:1px dashed var(--line-strong); border-radius:var(--r-m); }
  .empty button{ margin-top:14px; }
  .section-title{ font-size:var(--fs-sm); color:var(--text-faint); margin:0 0 12px; }

  /* home */
  .hero{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:4px 2px 22px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .hero .big, .stat-hero .big{ font-family:'Inter',sans-serif; font-weight:800; font-size:var(--fs-hero); line-height:1; letter-spacing:-.02em; color:#fff; }
  .hero .cap, .stat-hero .cap{ font-size:var(--fs-xs); color:var(--text-faint); margin-top:6px; }
  .hero .streak{ text-align:right; } .hero .streak .big{ color:#fff; }
  .file-list{ display:grid; gap:18px; margin-bottom:96px; }
  .file-slot{ position:relative; --b1:rgba(196,112,72,.46); --b2:rgba(176,134,78,.30); }
  .file-slot::before{ content:""; position:absolute; inset:-16px -8px; z-index:0; pointer-events:none; filter:blur(8px);
    background:radial-gradient(62% 72% at var(--x1,18%) var(--y1,28%), var(--b1), transparent 70%), radial-gradient(58% 70% at var(--x2,86%) var(--y2,78%), var(--b2), transparent 70%); }
  .file-slot .file-card{ position:relative; z-index:1; }
  @media (min-width:768px){ .file-list{ grid-template-columns:1fr 1fr; } }
  .file-card{ display:flex; align-items:center; gap:14px; position:relative; border-radius:24px; padding:16px; cursor:pointer;
    background:linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.17));
    -webkit-backdrop-filter:blur(28px) saturate(170%); backdrop-filter:blur(28px) saturate(170%);
    border:none;
    box-shadow:0 12px 32px rgba(0,0,0,.4);
    transition:transform .12s ease; }
  .file-card:active{ transform:scale(.98); }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .file-card{ background:var(--surface); } }
  @media (prefers-reduced-transparency:reduce){ .file-card{ -webkit-backdrop-filter:none; backdrop-filter:none; background:var(--surface); } }
  .file-icon{ width:48px; height:48px; border-radius:var(--r-s); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; font-weight:700; font-size:var(--fs-lg); color:#fff; }
  .file-icon img{ width:100%; height:100%; object-fit:cover; }
  .file-info{ flex:1; min-width:0; }
  .file-name{ font-size:var(--fs-md); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-meta{ font-size:var(--fs-xs); color:rgba(255,255,255,.82); margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:nowrap; white-space:nowrap; }
  .due-badge{ color:var(--accent); background:var(--accent-dim); border-radius:var(--r-pill); padding:1px 8px; font-weight:700; flex-shrink:0; }
  .done-badge{ color:var(--ok); background:var(--ok-dim); border-radius:var(--r-pill); padding:1px 10px; }
  .file-progress{ height:4px; background:var(--line); border-radius:2px; margin-top:10px; overflow:hidden; }
  .file-progress div{ height:100%; background:var(--ok); }
  .file-side{ display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
  .star-btn, .more-btn{ background:none; border:none; width:44px; height:44px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .star-btn{ font-size:var(--fs-lg); color:var(--line-strong); } .star-btn.active{ color:var(--accent); }
  .more-btn{ font-size:var(--fs-lg); color:var(--text-faint); }
  .fab-add{ position:fixed; right:24px; bottom:calc(var(--safe-b) + 24px); width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:32px; line-height:1; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.45); z-index:15; }
  .fab-add{ transition:transform .45s cubic-bezier(.2,.9,.25,1.1), box-shadow .3s; }
  .fab-add.open{ transform:rotate(135deg); z-index:65; }
  .pop-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .pop-backdrop.show{ opacity:1; pointer-events:auto; }
  .create-pop{ position:fixed; right:16px; bottom:calc(var(--safe-b) + 92px); width:min(360px, calc(100vw - 32px)); z-index:62;
    transform-origin:calc(100% - 36px) calc(100% + 40px); opacity:0; transform:scale(.35) translateY(16px); pointer-events:none;
    transition:transform .45s cubic-bezier(.2,.9,.25,1.05), opacity .3s ease;
    background:rgba(38,40,42,.78); -webkit-backdrop-filter:blur(28px) saturate(150%); backdrop-filter:blur(28px) saturate(150%);
    border-radius:24px; box-shadow:0 20px 50px rgba(0,0,0,.55); }
  .create-pop.show{ opacity:1; transform:none; pointer-events:auto; }
  .create-pop .pop-inner{ padding:20px; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
  .modal-backdrop[hidden]{ display:none; }
  .modal-card{ background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-m) var(--r-m) 0 0; padding:20px 20px calc(var(--safe-b) + 20px); width:100%; max-width:480px; }
  .modal-card p.msg{ font-size:var(--fs-md); line-height:1.6; margin:0 0 16px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .suggest-chip, .candidate-chip{ background:none; border:1px solid var(--line-strong); color:var(--text-dim); font-size:var(--fs-sm); min-height:40px; padding:0 14px; border-radius:var(--r-pill); cursor:pointer; }
  .suggest-chip:hover{ border-color:var(--accent); color:var(--accent); }
  input[type=text]{ width:100%; background:var(--bg); border:1px solid var(--line-strong); color:var(--text); border-radius:var(--r-s); padding:12px; font-size:var(--fs-md); font-family:inherit; margin-bottom:12px; }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }

  /* buttons */
  .btn{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; background:transparent; color:var(--text); border:1px solid var(--line-strong); border-radius:var(--r-pill); padding:10px 20px; font-size:var(--fs-sm); cursor:pointer; text-decoration:none; }
  .btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }
  .btn-primary:hover{ background:var(--accent); color:var(--accent-ink); filter:brightness(1.08); }
  .btn-danger{ color:var(--ng); border-color:var(--ng-dim); } .btn-danger:hover{ color:var(--ng); border-color:var(--ng); }
  .btn-block{ width:100%; } .btn[disabled]{ opacity:.5; cursor:default; }

  /* review */
  .direction-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .dir-btn{ flex:1; min-height:44px; background:none; border:1px solid var(--line-strong); color:var(--text-dim); font-size:var(--fs-sm); border-radius:var(--r-pill); cursor:pointer; }
  .dir-btn.active{ border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
  .due-count{ font-size:var(--fs-sm); color:var(--text-faint); margin-bottom:14px; display:flex; justify-content:space-between; }
  .review-scroll{ height:calc(100dvh - 250px); min-height:440px; overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .review-scroll::-webkit-scrollbar{ display:none; }
  .review-slide{ scroll-snap-align:start; scroll-snap-stop:always; min-height:100%; display:flex; flex-direction:column; justify-content:center; padding:4px 2px; }
  .slide-meta{ font-size:var(--fs-xs); color:var(--text-faint); margin-bottom:10px; }
  .judge-status{ text-align:center; font-size:var(--fs-sm); padding:14px; border-radius:var(--r-pill); border:1px solid var(--line-strong); }
  .judge-status.status-yes{ color:var(--ok); border-color:var(--ok-dim); background:var(--ok-dim); }
  .judge-status.status-no{ color:var(--ng); border-color:var(--ng-dim); background:var(--ng-dim); }
  .card-stage{ perspective:1000px; margin-bottom:16px; }
  .flashcard{ position:relative; display:grid; min-height:260px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--surface); cursor:pointer; box-shadow:0 12px 40px rgba(0,0,0,.4); transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,.2,.2,1); }
  .flashcard.flipped{ transform:rotateY(180deg); }
  .face{ grid-area:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .face.back{ transform:rotateY(180deg); }
  .type-tag{ font-size:var(--fs-xs); color:var(--text-faint); border:1px solid var(--line-strong); padding:1px 10px; border-radius:var(--r-pill); margin-bottom:12px; }
  .word{ font-family:'Inter',sans-serif; font-weight:800; font-size:var(--fs-xl); margin-bottom:8px; word-break:break-word; }
  .word[lang="ja"]{ font-family:'Noto Sans JP',sans-serif; font-weight:700; letter-spacing:0; }
  .word.long{ font-size:var(--fs-lg); }
  .meaning{ font-size:var(--fs-lg); margin-bottom:8px; line-height:1.5; }
  .meaning[lang="en"]{ font-family:'Inter',sans-serif; font-weight:800; font-size:var(--fs-xl); }
  .hint{ font-size:var(--fs-xs); color:var(--text-faint); margin-top:8px; }
  .accent-row{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .accent-btn{ background:none; border:1px solid var(--line-strong); color:var(--text-dim); font-size:var(--fs-xs); min-height:40px; padding:0 16px; border-radius:var(--r-pill); cursor:pointer; }
  .accent-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .play-btn{ background:none; border:1.5px solid var(--accent-dim); color:var(--accent); font-size:var(--fs-sm); min-height:44px; padding:0 20px; border-radius:var(--r-pill); cursor:pointer; }
  .play-btn:hover{ background:var(--accent-dim); }
  .play-icon-sm{ background:none; border:1px solid var(--line-strong); color:var(--text-dim); width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:var(--fs-xs); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .play-icon-sm:hover{ border-color:var(--accent); color:var(--accent); }
  .judge-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .judge-row button{ min-height:52px; font-size:var(--fs-md); font-weight:700; border-radius:var(--r-pill); cursor:pointer; border:1px solid; background:transparent; }
  .btn-no{ color:var(--ng); border-color:var(--ng-dim); } .btn-no:active{ background:var(--ng-dim); }
  .btn-yes{ background:var(--ok) !important; border-color:var(--ok) !important; color:#05200F; }

  /* list / add */
  .add-form{ padding:0 0 20px; margin-bottom:20px; border-bottom:1px solid var(--line-strong); }
  .add-form .row{ display:flex; gap:10px; margin-bottom:10px; }
  .add-form .row input{ flex:1; margin-bottom:0; }
  .add-form .err{ color:var(--ng); font-size:var(--fs-xs); margin:0 0 10px; }
  .type-toggle{ display:flex; gap:20px; margin-bottom:12px; font-size:var(--fs-sm); color:var(--text-dim); }
  .type-toggle label{ display:flex; align-items:center; gap:8px; min-height:44px; cursor:pointer; }
  .candidates{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .candidate-chip:hover{ border-color:var(--ok); color:var(--ok); }
  .candidate-chip.chosen{ border-color:var(--ok); color:var(--ok); background:var(--ok-dim); }
  .word-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .word-row .info{ flex:1; min-width:0; }
  .word-row .en{ font-family:'Inter',sans-serif; font-weight:700; font-size:var(--fs-md); }
  .word-row .tag{ font-size:var(--fs-xs); color:var(--text-faint); border:1px solid var(--line-strong); border-radius:var(--r-pill); padding:0 8px; margin-left:6px; }
  .word-row .ja{ font-size:var(--fs-sm); color:var(--text-faint); margin-top:2px; }
  .box-dots{ display:flex; gap:3px; flex-shrink:0; }
  .box-dots span{ width:6px; height:6px; border-radius:50%; background:var(--line-strong); } .box-dots span.on{ background:var(--accent); }
  .word-row .del{ background:none; border:none; color:var(--text-faint); font-size:var(--fs-md); width:44px; height:44px; cursor:pointer; flex-shrink:0; }
  .word-row .del:hover{ color:var(--ng); }

  /* quiz */
  .quiz-progress{ font-size:var(--fs-xs); color:var(--text-faint); margin-bottom:10px; }
  .quiz-q{ text-align:center; padding:24px 16px; border-bottom:1px solid var(--line-strong); margin-bottom:16px; }
  .quiz-q .word{ margin-bottom:12px; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{ text-align:left; background:var(--surface); border:1px solid var(--line-strong); color:var(--text); min-height:52px; padding:12px 16px; border-radius:var(--r-s); font-size:var(--fs-sm); cursor:pointer; }
  .choice:hover{ border-color:var(--accent); }
  .choice.correct{ border-color:var(--ok); color:var(--ok); background:var(--ok-dim); }
  .choice.wrong{ border-color:var(--ng); color:var(--ng); background:var(--ng-dim); }
  .choice[disabled]{ cursor:default; }
  .quiz-result{ text-align:center; padding:40px 16px; }
  .quiz-result .score{ font-family:'Inter',sans-serif; font-weight:800; font-size:var(--fs-hero); color:var(--accent); margin-bottom:6px; }

  /* stats */
  .stat-hero{ display:flex; gap:32px; padding:4px 2px 20px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .stat-hero > div:nth-child(2) .big{ color:#fff; }
  .stat-lines{ margin-bottom:26px; }
  .stat-line{ display:flex; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--line); font-size:var(--fs-md); }
  .stat-line span:last-child{ font-weight:700; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .bar-row .name{ font-size:var(--fs-xs); color:var(--text-dim); width:52px; flex-shrink:0; }
  .bar-track{ flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--ok); }
  .bar-row .count{ font-size:var(--fs-xs); color:var(--text-faint); width:28px; text-align:right; }

  /* settings */
  .settings-block{ margin-bottom:28px; }
  .settings-block h3{ font-size:var(--fs-md); font-weight:700; margin:0 0 4px; }
  .settings-block .desc{ font-size:var(--fs-sm); color:var(--text-faint); margin:0 0 8px; line-height:1.6; }
  .radio-card{ display:flex; align-items:center; gap:12px; min-height:52px; padding:0 2px; border-bottom:1px solid var(--line); cursor:pointer; font-size:var(--fs-md); }
  .radio-card.selected{ color:var(--accent); }
  .radio-card input{ accent-color:var(--accent); width:20px; height:20px; }

  .toast{ position:fixed; bottom:calc(var(--safe-b) + 24px); left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--line-strong); color:var(--text); padding:6px 18px; min-height:44px; display:flex; align-items:center; border-radius:var(--r-pill); font-size:var(--fs-sm); opacity:0; pointer-events:none; transition:opacity .3s; z-index:70; white-space:nowrap; }
  .toast.show{ opacity:1; pointer-events:auto; }
  .toast button{ background:none; border:none; color:var(--accent); font-weight:700; font-size:var(--fs-sm); margin-left:14px; min-height:44px; cursor:pointer; }
  .loading{ text-align:center; padding:60px 0; color:var(--text-faint); font-size:var(--fs-sm); }
</style>

</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="brand-btn" id="brand-home-btn" type="button"><img class="brand-logo" src="logo.png" alt="WORD STREAK"></button>
    <div class="topbar-right">
      <span class="current-file" id="current-file-name"></span>
      <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="menu-backdrop" id="menu-backdrop"></div>
  <div class="menu-panel" id="menu-panel">
    <div class="menu-header">

<script>
const DEFAULT_WORDS = [
  ["abandon","捨てる、見放す","word"],["ability","能力","word"],["absorb","吸収する","word"],
  ["accurate","正確な","word"],["achieve","達成する","word"],["acknowledge","認める","word"],

  ["advantage","利点","word"],["ambiguous","曖昧な","word"],["anticipate","予期する","word"],
  ["apparent","明らかな","word"],["appreciate","感謝する、理解する","word"],["approach","取り組み方、近づく","word"],
  ["appropriate","適切な","word"],["assume","仮定する","word"],["assure","保証する","word"],
  ["attain","達成する","word"],["attitude","態度","word"],["authority","権威","word"],
  ["available","利用できる","word"],["aware","気づいている","word"],["benefit","利益","word"],
  ["capable","能力がある","word"],["circumstance","状況","word"],["clarify","明確にする","word"],
  ["collapse","崩壊する","word"],["commit","約束する、専念する","word"],["complex","複雑な","word"],
  ["comprehend","理解する","word"],["conclude","結論づける","word"],["conflict","対立","word"],
  ["consequence","結果","word"],["considerable","かなりの","word"],["consistent","一貫した","word"],
  ["constant","絶え間ない","word"],["contribute","貢献する","word"],["convince","納得させる","word"],

  ["give up","諦める","phrase"],["look forward to","楽しみにする","phrase"],
  ["run out of","〜を使い果たす","phrase"],["get along with","〜と仲良くやる","phrase"],
  ["break the ice","場を和ませる","phrase"],["under the weather","体調が悪い","phrase"],
  ["a piece of cake","とても簡単なこと","phrase"],["once in a while","たまに","phrase"]
];

const BOX_INTERVAL_DAYS = [0, 1, 2, 4, 7, 14];
const MAX_BOX = BOX_INTERVAL_DAYS.length - 1;
const STORE_KEY = "vocab-notebook-store-v2";
const OLD_STORE_KEY = "vocab-notebook-v1";
const SETTINGS_KEY = "vocab-notebook-settings-v1";

let store = { files: [], wordsByFile: {} };
let currentFileId = null;
let words = [];
let settings = { accent: "uk", reviewDirection: "en-ja" };
let currentScreen = "home";
let reviewQueue = null;
let quizState = null;
let voicesCache = [];
let lookupToken = 0;
let lookupTimer = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return dateStr(new Date()); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return dateStr(d); }
const STREAK_KEY = "wordstreak-streak-v1";
function getStreak(){
  try{
    const v = JSON.parse(localStorage.getItem(STREAK_KEY) || 'null');
    if(v && (v.last === todayStr() || v.last === yesterdayStr())) return { last: v.last, count: v.count || 0 };
  } catch(e){}
  return { last: null, count: 0 };
}
function recordStudy(){
  const st = getStreak();
  if(st.last === todayStr()) return;
  const next = { last: todayStr(), count: (st.last === yesterdayStr() ? st.count : 0) + 1 };
  try{ localStorage.setItem(STREAK_KEY, JSON.stringify(next)); } catch(e){}
}
function daysBetween(a,b){ return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function isDue(w){
  if(!w.lastReviewed) return true;
  const interval = BOX_INTERVAL_DAYS[w.box] || 0;
  return daysBetween(w.lastReviewed, todayStr()) >= interval;
}
function makeDefaultWordList(){
  return DEFAULT_WORDS.map(([en,ja,type]) => ({
    id: uid(), en, ja, type, box: 0, lastReviewed: null, correct: 0, wrong: 0
  }));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer = null;
function showToast(msg, action, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  if(action){
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = action.label;
    b.addEventListener('click', () => { t.classList.remove('show'); action.fn(); });
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1600);
}
function askConfirm(message, okLabel, onOk){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal-card"><p class="msg">${escapeHtml(message)}</p>
    <button class="btn btn-danger btn-block" type="button" data-ok>${escapeHtml(okLabel)}</button>
    <button class="btn btn-block" type="button" data-cancel style="margin-top:8px">やめる</button></div>`;
  const close = () => back.remove();
  back.addEventListener('click', (e) => { if(e.target === back) close(); });
  back.querySelector('[data-cancel]').addEventListener('click', close);
  back.querySelector('[data-ok]').addEventListener('click', () => { close(); onOk(); });
  document.body.appendChild(back);
}

/* ---------- 発音(音声合成) ---------- */
function loadVoices(){
  voicesCache = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : [];
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, accent){
  if(!('speechSynthesis' in window)){ showToast('この端末は読み上げに対応していません'); return; }
  const lang = accent === 'us' ? 'en-US' : 'en-GB';
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  const voice = voicesCache.find(v => v.lang === lang) || voicesCache.find(v => v.lang && v.lang.startsWith('en'));
  if(voice) utter.voice = voice;
  utter.rate = 0.95;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

/* ---------- データの読み書き(ファイル対応) ---------- */
async function loadSettings(){
  settings = { accent: "uk", reviewDirection: "en-ja" };
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(raw) settings = { accent: "uk", reviewDirection: "en-ja", ...JSON.parse(raw) };
  } catch(e){ /* 既定値を使う */ }
}
async function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e){}
}
async function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      store.files = Array.isArray(parsed.files) ? parsed.files : [];
      store.wordsByFile = (parsed.wordsByFile && typeof parsed.wordsByFile === 'object') ? parsed.wordsByFile : {};
      store.importedPresets = Array.isArray(parsed.importedPresets) ? parsed.importedPresets : [];
      return;
    }
    // 旧バージョン(ファイル分けなし)のデータがあれば1つのファイルとして引き継ぐ
    let initialWords = null;
    try{
      const oldRaw = localStorage.getItem(OLD_STORE_KEY);
      if(oldRaw) initialWords = JSON.parse(oldRaw).map(w => ({ type: 'word', ...w }));
    } catch(e){ initialWords = null; }
    if(!initialWords || !initialWords.length) initialWords = makeDefaultWordList();
    const id = uid();
    store.files = [{ id, name: "マイ単語帳", createdAt: todayStr() }];
    store.wordsByFile = { [id]: initialWords };
    persistStore();
  } catch(e){
    const id = uid();
    store.files = [{ id, name: "マイ単語帳", createdAt: todayStr() }];
    store.wordsByFile = { [id]: makeDefaultWordList() };
  }
}
/* ---------- 付属の単語帳(Section 1〜5)の取り込み ---------- */
function importPresets(force){
  if(typeof PRESET_SECTIONS === 'undefined') return 0;
  if(!Array.isArray(store.importedPresets)) store.importedPresets = [];
  let added = 0;
  PRESET_SECTIONS.forEach(sec => {
    const skip = force
      ? store.files.some(f => f.presetId === sec.id)
      : store.importedPresets.includes(sec.id);
    if(skip) return;
    const id = uid();
    store.files.push({ id, name: sec.name, createdAt: todayStr(), favorite: false, icon: null, presetId: sec.id });
    store.wordsByFile[id] = sec.words.map(([en, ja]) => ({
      id: uid(), en, ja, type: 'word', box: 0, lastReviewed: null, correct: 0, wrong: 0
    }));
    if(!store.importedPresets.includes(sec.id)) store.importedPresets.push(sec.id);
    added++;
  });
  if(added) persistStore();
  return added;
}
function persistStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
}
async function saveData(){
  if(!currentFileId) return;
  store.wordsByFile[currentFileId] = words;
  persistStore();
}

/* ---------- ファイルアイコン(端末の写真から変更) ---------- */
let pendingIconFileId = null;
const iconFileInput = document.getElementById('icon-file-input');
function avatarColor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = name.charCodeAt(i) + ((hash<<5) - hash); }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 42%)`;
}
function resizeImageToDataURL(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
iconFileInput.addEventListener('change', async () => {
  const file = iconFileInput.files[0];
  const targetId = pendingIconFileId;
  pendingIconFileId = null;
  if(!file || !targetId) return;
  try{
    const dataUrl = await resizeImageToDataURL(file, 128);
    const f = store.files.find(x => x.id === targetId);
    if(f){
      f.icon = dataUrl;
      persistStore();
      if(currentScreen === 'home') renderHome();
      showToast('アイコンを変更しました');
    }
  } catch(e){
    showToast('画像を読み込めませんでした');
  }
  iconFileInput.value = '';
});

/* ---------- ホーム(ファイル選択・カード型) ---------- */
let actionFileId = null;
const BLOB_COLORS = ['196,112,72','104,118,156','158,96,116','176,134,78'];
function hashStr(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seededRand(seed){
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// 単語帳ごとに、にじみの場所と色をランダムに決める(同じ単語帳では毎回同じ配置)
function blobStyle(id){
  const r = seededRand(hashStr(String(id)));
  const c1 = Math.floor(r()*BLOB_COLORS.length);
  const c2 = (c1 + 1 + Math.floor(r()*(BLOB_COLORS.length-1))) % BLOB_COLORS.length;
  const left = Math.round(8 + r()*32), right = Math.round(60 + r()*32);
  const swap = r() < 0.5;
  const x1 = swap ? right : left, x2 = swap ? left : right;
  const y1 = Math.round(15 + r()*70), y2 = Math.round(15 + r()*70);
  return `--x1:${x1}%;--y1:${y1}%;--x2:${x2}%;--y2:${y2}%;--b1:rgba(${BLOB_COLORS[c1]},.46);--b2:rgba(${BLOB_COLORS[c2]},.32)`;
}
function renderHome(){
  document.getElementById('current-file-name').textContent = '';
  const body = document.getElementById('home-body');
  const files = [...store.files].sort((a,b) => (b.favorite?1:0) - (a.favorite?1:0));

    const pct = list.length ? Math.round(mastered / list.length * 100) : 0;
    const numMatch = (f.name || '').match(/^Section\s*(\d+)/i);
    const initial = escapeHtml(numMatch ? numMatch[1] : ((f.name || '?').trim().charAt(0).toUpperCase() || '?'));
    const iconInner = f.icon ? `<img src="${f.icon}" alt="">` : `<span>${initial}</span>`;
    const iconStyle = f.icon ? '' : ` style="background:${avatarColor(f.name || '')}"`;
    const badge = list.length === 0 ? '' : `<span class="due-badge">今日 ${doneToday}語</span>`;
    return `
      <div class="file-slot" style="${blobStyle(f.id)}"><div class="file-card" data-id="${f.id}">
        <div class="file-icon"${iconStyle}>${iconInner}</div>
        <div class="file-info">
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta"><span>${list.length}語</span><span>マスター ${pct}%</span>${badge}</div>

        </div>

          <button class="star-btn ${f.favorite ? 'active' : ''}" data-id="${f.id}" type="button" aria-label="お気に入り">★</button>
        </div>
      </div></div>`;
  }).join('');

  const totalDone = Object.values(store.wordsByFile).flat().filter(w => w.lastReviewed === todayStr()).length;
  const streak = getStreak().count;
  const hero = `<div class="hero">
      <div><div class="big">${totalDone}</div><div class="cap">語 今日の復習</div></div>
      <div class="streak"><div class="big">${streak}</div><div class="cap">日 連続学習</div></div>
    </div>`;
  body.innerHTML = `
    ${files.length ? hero : ''}
    ${files.length ? `<div class="file-list">${rows}</div>` : `<div class="empty" style="margin-bottom:20px">まだ単語帳がありません。<br>最初の単語帳を作りましょう。<br><button class="btn btn-primary" id="btn-empty-create" type="button">最初の単語帳を作る</button></div>`}
    <button class="fab-add" id="fab-add-file" type="button" aria-label="単語帳を追加">+</button>
    <div class="pop-backdrop" id="new-file-backdrop"></div>
    <div class="create-pop" id="new-file-pop" role="dialog" aria-label="新しい単語帳を作成">
      <div class="pop-inner">
        <p class="section-title">新しい単語帳を作成</p>
        <div class="chip-row">
          ${['試験対策','IELTS','TOEIC','日常会話'].map(s => `<button type="button" class="suggest-chip" data-name="${s}">${s}</button>`).join('')}
        </div>
        <div class="row">
          <input id="new-file-name" type="text" placeholder="単語帳の名前 (例: IELTS単語)">
        </div>
        <button class="btn btn-primary btn-block" id="btn-create-file" type="button">作成する</button>
        <button class="btn btn-block" id="btn-cancel-create" type="button" style="margin-top:8px">キャンセル</button>
      </div>
    </div>
  `;

  body.querySelectorAll('.file-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if(e.target.closest('.star-btn')) return;
      openFile(card.dataset.id);
    });
  });
  body.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavorite(btn.dataset.id); });
  });

  const popBackdrop = document.getElementById('new-file-backdrop');
  const pop = document.getElementById('new-file-pop');
  const fab = document.getElementById('fab-add-file');
  const setCreate = (on) => {
    popBackdrop.classList.toggle('show', on);
    pop.classList.toggle('show', on);
    fab.classList.toggle('open', on);
  };
  fab.addEventListener('click', () => setCreate(!pop.classList.contains('show')));
  const emptyBtn = document.getElementById('btn-empty-create');
  if(emptyBtn) emptyBtn.addEventListener('click', () => setCreate(true));
  document.getElementById('btn-cancel-create').addEventListener('click', () => setCreate(false));
  popBackdrop.addEventListener('click', () => setCreate(false));
  body.querySelectorAll('.suggest-chip').forEach(chip => {
    chip.addEventListener('click', () => { document.getElementById('new-file-name').value = chip.dataset.name; });
  });
  document.getElementById('btn-create-file').addEventListener('click', () => {
    const input = document.getElementById('new-file-name');
    const name = input.value.trim();
    if(!name){ showToast('単語帳の名前を入力してください'); return; }
    createFile(name);
    input.value = '';
  });
}
function createFile(name){
  const id = uid();
  store.files.push({ id, name, createdAt: todayStr(), favorite: false, icon: null });
  store.wordsByFile[id] = [];
  persistStore();
  renderHome();
  showToast('単語帳を作成しました');
}
function deleteFile(id){
  store.files = store.files.filter(f => f.id !== id);
  delete store.wordsByFile[id];
  persistStore();
  if(currentFileId === id) currentFileId = null;
  renderHome();
  showToast('削除しました');
}
function toggleFavorite(id){
  const f = store.files.find(x => x.id === id);
  if(!f) return;
  f.favorite = !f.favorite;
  persistStore();
  renderHome();
}
function openFile(id){
  currentFileId = id;
  words = store.wordsByFile[id] || (store.wordsByFile[id] = []);
  reviewQueue = null;
  const f = store.files.find(x => x.id === id);
  document.getElementById('current-file-name').textContent = f ? f.name : '';
  switchScreen('review');
}

/* ---------- 復習(フラッシュカード・縦スクロール) ---------- */
function ensureReviewQueue(){
  if(reviewQueue === null){
    reviewQueue = words.filter(isDue).map(w => ({
      word: w,
      direction: settings.reviewDirection === 'mixed'
        ? (Math.random() < 0.5 ? 'en-ja' : 'ja-en')
        : settings.reviewDirection,
      judged: false,
      lastOk: null
    }));
    buildReviewDOM();
  }
}
function openReview(){
  ensureReviewQueue();
}
function restartReview(){
  reviewQueue = null;
  ensureReviewQueue();
}
function setReviewDirection(val, label){
  if(settings.reviewDirection === val) return;
  settings.reviewDirection = val;
  saveSettings();
  reviewQueue = null;
  ensureReviewQueue();
  showToast(`出題方向を「${label}」にしました`);
}
function buildReviewDOM(){
  const body = document.getElementById('review-body');
  body.innerHTML = '';

  const dirRow = document.createElement('div');
  dirRow.className = 'direction-toggle';
  [['en-ja','英→日'], ['ja-en','日→英'], ['mixed','ランダム']].forEach(([val,label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dir-btn' + (settings.reviewDirection === val ? ' active' : '');
    b.textContent = label;
    b.addEventListener('click', () => setReviewDirection(val, label));
    dirRow.appendChild(b);
  });
  body.appendChild(dirRow);

  if(!currentFileId){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '単語帳が選択されていません。';
    body.appendChild(empty);
    return;
  }

  if(reviewQueue.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `今日復習する単語はありません。<br>クイズで力試しをするか、単語を増やしましょう。
      <br><button class="btn btn-primary" onclick="switchScreen('list')">単語を追加する</button>`;
    body.appendChild(empty);
    return;
  }

  const header = document.createElement('div');
  header.className = 'due-count';
  header.innerHTML = `<span>今日の復習</span><span id="review-progress"></span>`;
  body.appendChild(header);

  const scrollEl = document.createElement('div');
  scrollEl.className = 'review-scroll';
  body.appendChild(scrollEl);

  reviewQueue.forEach(item => scrollEl.appendChild(buildCardSlide(item)));

  const doneSlide = document.createElement('div');
  doneSlide.className = 'review-slide';
  doneSlide.innerHTML = `<div class="empty" style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      今日の復習が終わりました。よくできました。
      <br><button class="btn btn-primary" type="button" id="btn-restart-review">もう一度見る</button>
    </div>`;
  doneSlide.querySelector('#btn-restart-review').addEventListener('click', restartReview);
  scrollEl.appendChild(doneSlide);

  updateReviewProgress();
}
function buildCardSlide(item){
  const w = item.word;
  const isEnFirst = item.direction !== 'ja-en';
  const frontText = isEnFirst ? w.en : w.ja;
  const backText = isEnFirst ? w.ja : w.en;
  const frontIsEnglish = isEnFirst;
  const backIsEnglish = !isEnFirst;
  const longFront = frontText.length > 14 ? 'long' : '';
  const directionLabel = isEnFirst ? '英語 → 日本語' : '日本語 → 英語';
  const playBlockHtml = `
    <button class="play-btn" type="button" data-role="play-default">発音を聞く</button>
    <div class="accent-row">
      <button class="accent-btn" data-accent="uk" type="button">イギリス</button>
      <button class="accent-btn" data-accent="us" type="button">アメリカ</button>
    </div>`;

  const slide = document.createElement('div');
  slide.className = 'review-slide';
  slide.innerHTML = `
    <div class="slide-meta">Box ${w.box+1}</div>
    <div class="card-stage">
      <div class="flashcard">
        <div class="face front">
          ${w.type==='phrase' ? '<div class="type-tag">熟語</div>' : ''}
          <div class="word ${longFront}" lang="${frontIsEnglish ? 'en' : 'ja'}">${escapeHtml(frontText)}</div>
          ${frontIsEnglish ? playBlockHtml : ''}
          <div class="hint">タップして${frontIsEnglish ? '意味' : '英語'}を見る</div>
        </div>
        <div class="face back">
          <div class="meaning" lang="${backIsEnglish ? 'en' : 'ja'}">${escapeHtml(backText)}</div>
          ${backIsEnglish ? playBlockHtml : ''}
        </div>
      </div>
    </div>
    <div class="judge-row" style="visibility:hidden">
      <button class="btn-no" type="button" data-judge="no">わからなかった</button>
      <button class="btn-yes" type="button" data-judge="yes">できた</button>
    </div>
    <div class="judge-status" style="display:none"></div>
  `;

  const card = slide.querySelector('.flashcard');
  const judgeRow = slide.querySelector('.judge-row');
  const statusEl = slide.querySelector('.judge-status');

  card.addEventListener('click', (e) => {
    if(e.target.closest('button')) return;
    card.classList.toggle('flipped');
    if(!item.judged) judgeRow.style.visibility = 'visible';
  });
  slide.querySelectorAll('[data-role="play-default"]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); speak(w.en, settings.accent); });
  });
  slide.querySelectorAll('.accent-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); speak(w.en, btn.dataset.accent); });
  });
  judgeRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(item.judged) return;
      applyJudge(item, btn.dataset.judge === 'yes');
      judgeRow.style.display = 'none';
      showJudgeStatus(statusEl, item.lastOk);
      updateReviewProgress();
    });
  });
  if(item.judged){
    judgeRow.style.display = 'none';
    showJudgeStatus(statusEl, item.lastOk);
  }
  return slide;
}
function showJudgeStatus(statusEl, ok){
  statusEl.style.display = 'block';
  statusEl.textContent = ok ? '記録しました:できた' : '記録しました:わからなかった';
  statusEl.classList.toggle('status-yes', ok);
  statusEl.classList.toggle('status-no', !ok);
}
function applyJudge(item, ok){
  const w = item.word;
  if(ok){ w.box = Math.min(MAX_BOX, w.box + 1); w.correct = (w.correct||0) + 1; }
  else { w.box = 0; w.wrong = (w.wrong||0) + 1; }
  w.lastReviewed = todayStr();
  recordStudy();
  item.judged = true;
  item.lastOk = ok;
  saveData();
}
function updateReviewProgress(){
  const el = document.getElementById('review-progress');
  if(!el) return;
  const completed = reviewQueue.filter(it => it.judged).length;
  el.textContent = `${completed} / ${reviewQueue.length} 完了`;
}

/* ---------- クイズ ---------- */
function renderQuizStart(){
  const body = document.getElementById('quiz-body');
  if(words.length < 4){
    body.innerHTML = `<div class="empty">クイズには単語が4つ以上必要です。<br>単語帳に追加してください。
      <br><button class="btn btn-primary" onclick="switchScreen('list')">単語を追加する</button></div>`;
    return;
  }
  body.innerHTML = `<div class="empty">全${words.length}語からランダムに10問出題します。
    <br><button class="btn btn-primary" onclick="startQuiz()">クイズを始める</button></div>`;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function startQuiz(){
  const pool = shuffle(words).slice(0, Math.min(10, words.length));
  quizState = { questions: pool, index: 0, score: 0, answered: false };
  paintQuiz();
}
function paintQuiz(){
  const body = document.getElementById('quiz-body');
  const st = quizState;
  if(st.index >= st.questions.length){
    body.innerHTML = `
      <div class="quiz-result">
        <div class="score">${st.score} / ${st.questions.length}</div>
        <p style="color:var(--text-faint); font-size:13px;">正解率 ${Math.round(st.score/st.questions.length*100)}%</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="startQuiz()">もう一度挑戦する</button>
      </div>`;
    return;
  }
  const q = st.questions[st.index];
  const wrongPool = words.filter(w => w.id !== q.id);
  const distractors = shuffle(wrongPool).slice(0,3).map(w => w.ja);
  const options = shuffle([q.ja, ...distractors]);
  st.answered = false;
  body.innerHTML = `
    <div class="quiz-progress">問題 ${st.index+1} / ${st.questions.length} ・ 正解 ${st.score}</div>
    <div class="quiz-q">
      <div class="word" lang="en">${escapeHtml(q.en)}</div>
      <button class="play-icon-sm" id="quiz-play" type="button" aria-label="発音を聞く">▶</button>
    </div>
    <div class="choices">
      ${options.map(op => `<button class="choice" data-ans="${escapeHtml(op)}">${escapeHtml(op)}</button>`).join('')}
    </div>
  `;
  document.getElementById('quiz-play').addEventListener('click', () => speak(q.en, settings.accent));
  body.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', () => onQuizAnswer(btn, q)));
}
function onQuizAnswer(btn, q){
  const st = quizState;
  if(st.answered) return;
  st.answered = true;
  recordStudy();
  const chosen = btn.dataset.ans;
  const correct = chosen === q.ja;
  if(correct) st.score++;
  const target = words.find(w => w.id === q.id);
  if(target){
    if(correct){ target.box = Math.min(MAX_BOX, target.box+1); target.correct=(target.correct||0)+1; }
    else { target.box = 0; target.wrong=(target.wrong||0)+1; }
    target.lastReviewed = todayStr();
    saveData();
  }
  document.querySelectorAll('#quiz-body .choice').forEach(b => {
    b.disabled = true;
    if(b.dataset.ans === q.ja) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });
  setTimeout(() => { st.index++; paintQuiz(); }, 900);
}

/* ---------- 単語帳・翻訳候補 ---------- */
function renderList(){
  document.getElementById('list-count').textContent = `登録済み ${words.length} 語`;
  const body = document.getElementById('list-body');
  if(words.length === 0){
    body.innerHTML = `<div class="empty">まだ単語がありません。上のフォームから追加しましょう。</div>`;
    return;
  }
  const sorted = words.slice().sort((a,b) => a.en.localeCompare(b.en));
  body.innerHTML = sorted.map(w => `
    <div class="word-row">
      <button class="play-icon-sm" data-speak="${escapeHtml(w.en)}" aria-label="発音を聞く" type="button">▶</button>
      <div class="info">
        <div class="en-line"><span class="en">${escapeHtml(w.en)}</span>${w.type==='phrase'?'<span class="tag">熟語</span>':''}</div>
        <div class="ja">${escapeHtml(w.ja)}</div>
      </div>
      <div class="box-dots">
        ${Array.from({length: MAX_BOX+1}).map((_,i) => `<span class="${i<=w.box?'on':''}"></span>`).join('')}
      </div>
      <button class="del" data-id="${w.id}" aria-label="削除">✕</button>
    </div>
  `).join('');
  body.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', () => deleteWord(btn.dataset.id)));
  body.querySelectorAll('[data-speak]').forEach(btn => btn.addEventListener('click', () => speak(btn.dataset.speak, settings.accent)));
}
function deleteWord(id){
  const fid = currentFileId;
  const idx = words.findIndex(w => w.id === id);
  if(idx < 0) return;
  const removed = words[idx];
  words = words.filter(w => w.id !== id);
  saveData();
  renderList();
  showToast('削除しました', { label: '元に戻す', fn: () => {
    if(currentFileId !== fid) return;
    words.splice(Math.min(idx, words.length), 0, removed);
    saveData(); renderList();
  } }, 5000);
}

async function fetchCandidates(text){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ja`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  let scored = [];
  if(data.responseData && data.responseData.translatedText){
    scored.push({ text: data.responseData.translatedText, score: 1.5 });
  }
  if(Array.isArray(data.matches)){
    data.matches.forEach(m => {
      if(!m.translation) return;
      const match = typeof m.match === 'number' ? m.match : 0.5;
      const quality = typeof m.quality === 'number' ? m.quality : (parseFloat(m.quality) || 50);
      scored.push({ text: m.translation, score: match + quality/200 });
    });
  }
  scored = scored.filter(s => s.text && s.text.trim().length > 0 && s.text.length <= 22 &&
    !/[。.!?！?].+[。.!?！?]/.test(s.text));
  scored.sort((a,b) => b.score - a.score);
  const seen = new Set();
  const deduped = [];
  for(const s of scored){
    const key = s.text.trim().toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    deduped.push(s.text.trim());
  }
  return deduped.slice(0, 8);
}
async function doLookup(en){
  const box = document.getElementById('candidates');
  box.innerHTML = `<span style="font-size:12px;color:var(--text-faint)">検索中…</span>`;
  const myToken = ++lookupToken;
  try{
    const candidates = await fetchCandidates(en);
    if(myToken !== lookupToken) return;
    if(candidates.length === 0){
      box.innerHTML = `<span style="font-size:12px;color:var(--text-faint)">候補が見つかりませんでした。直接入力してください。</span>`;
    } else {
      box.innerHTML = candidates.map(c => `<button type="button" class="candidate-chip" data-c="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
      box.querySelectorAll('.candidate-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.getElementById('in-ja').value = chip.dataset.c;
          box.querySelectorAll('.candidate-chip').forEach(c2 => c2.classList.remove('chosen'));
          chip.classList.add('chosen');
        });
      });
    }
  } catch(e){
    if(myToken !== lookupToken) return;
    box.innerHTML = `<span style="font-size:12px;color:var(--text-faint)">候補を取得できませんでした(ネット接続が必要です)。直接入力してください。</span>`;
  }
}
const enInputEl = document.getElementById('in-en');
const cambridgeLinkEl = document.getElementById('cambridge-link');
enInputEl.addEventListener('input', () => {
  const val = enInputEl.value.trim();
  clearTimeout(lookupTimer);
  document.getElementById('add-err').style.display = 'none';
  if(val){
    cambridgeLinkEl.href = `https://dictionary.cambridge.org/search/english/direct/?q=${encodeURIComponent(val)}`;
    cambridgeLinkEl.style.opacity = '1';
    cambridgeLinkEl.style.pointerEvents = 'auto';
  } else {
    cambridgeLinkEl.href = '#';
    cambridgeLinkEl.style.opacity = '0.4';
    cambridgeLinkEl.style.pointerEvents = 'none';
  }
  if(val.length < 2){
    document.getElementById('candidates').innerHTML = '';
    return;
  }
  lookupTimer = setTimeout(() => doLookup(val), 500);
});
document.getElementById('btn-add').addEventListener('click', () => {
  const enInput = document.getElementById('in-en');
  const jaInput = document.getElementById('in-ja');
  const err = document.getElementById('add-err');
  const en = enInput.value.trim();
  const ja = jaInput.value.trim();
  const type = document.querySelector('input[name="wtype"]:checked').value;
  err.style.display = 'none';
  if(!en || !ja){
    err.textContent = '英語と意味の両方を入力してください';
    err.style.display = 'block';
    return;
  }
  if(words.some(w => w.en.toLowerCase() === en.toLowerCase())){
    err.textContent = 'それはすでに登録されています';
    err.style.display = 'block';
    return;
  }
  words.push({ id: uid(), en, ja, type, box: 0, lastReviewed: null, correct: 0, wrong: 0 });
  saveData();
  enInput.value = ''; jaInput.value = '';
  document.getElementById('candidates').innerHTML = '';
  document.querySelector('input[name="wtype"][value="word"]').checked = true;
  renderList();
  showToast('追加しました');
});

/* ---------- 成績 ---------- */
function renderStats(){
  const body = document.getElementById('stats-body');
  const list = currentFileId ? words : Object.values(store.wordsByFile).flat();
  const cur = store.files.find(f => f.id === currentFileId);
  const scope = cur ? cur.name : 'すべての単語帳';
  const total = list.length;
  const mastered = list.filter(w => w.box >= MAX_BOX).length;
  const doneToday = list.filter(w => w.lastReviewed === todayStr()).length;
  const reviews = list.reduce((a,w) => a + (w.correct||0) + (w.wrong||0), 0);
  const correct = list.reduce((a,w) => a + (w.correct||0), 0);
  const boxCounts = Array.from({length: MAX_BOX+1}).map((_,i) => list.filter(w => w.box === i).length);
  const maxCount = Math.max(1, ...boxCounts);
  body.innerHTML = `
    <p class="section-title">${escapeHtml(scope)}</p>
    <div class="stat-hero">
      <div><div class="big">${getStreak().count}</div><div class="cap">日 連続学習</div></div>
      <div><div class="big">${doneToday}</div><div class="cap">語 今日の復習</div></div>
    </div>
    <div class="stat-lines">
      <div class="stat-line"><span>登録単語</span><span>${total}語</span></div>
      <div class="stat-line"><span>マスター済み</span><span>${mastered}語</span></div>
      <div class="stat-line"><span>正解率</span><span>${reviews ? Math.round(correct/reviews*100) + '%(' + reviews + '回中)' : '—'}</span></div>
    </div>
    <p class="section-title">定着度(Boxが高いほど覚えている)</p>
    ${boxCounts.map((c,i) => `
      <div class="bar-row">
        <div class="name">Box ${i+1}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c/maxCount*100)}%"></div></div>
        <div class="count">${c}</div>
      </div>
    `).join('')}
  `;
}

/* ---------- 設定 ---------- */
function renderSettings(){
  document.querySelectorAll('input[name="accent"]').forEach(r => {
    r.checked = (r.value === settings.accent);
    r.closest('.radio-card').classList.toggle('selected', r.value === settings.accent);
  });
  document.querySelectorAll('input[name="direction"]').forEach(r => {
    r.checked = (r.value === settings.reviewDirection);
    r.closest('.radio-card').classList.toggle('selected', r.value === settings.reviewDirection);
  });
}
document.querySelectorAll('input[name="accent"]').forEach(r => {
  r.addEventListener('change', () => {
    settings.accent = r.value;
    saveSettings();
    renderSettings();
    showToast(r.value === 'uk' ? 'イギリス発音を初期設定にしました' : 'アメリカ発音を初期設定にしました');
  });
});
document.querySelectorAll('input[name="direction"]').forEach(r => {
  r.addEventListener('change', () => {
    settings.reviewDirection = r.value;
    saveSettings();
    renderSettings();
    reviewQueue = null;
    const labels = { 'en-ja': '英語→日本語', 'ja-en': '日本語→英語', 'mixed': 'ランダム' };
    showToast(`出題方向を「${labels[r.value]}」にしました`);
  });
});

(async function init(){
  await loadSettings();
  await loadStore();
  importPresets(false);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  switchScreen('home');
})();

/* ---------- オフライン対応(Service Worker)と自動更新 ---------- */
if('serviceWorker' in navigator){
  let hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadController){ hadController = true; return; }  // 初回インストール時は再読み込みしない
    if(reloading) return;
    reloading = true;
    location.reload();  // 新しいバージョンに切り替わったら自動で読み込み直す
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update();
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') reg.update();  // アプリに戻ったときも更新を確認
      });
    }).catch(() => { /* 登録できなくてもアプリ自体は通常どおり使えます */ });
  });
}
